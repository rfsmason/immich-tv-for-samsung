name: Bug report
description: Something in the app doesn't work as it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.

        This repository is public, so please don't include your server address, API key, or photos from your library.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Albums.
        2. Choose an album.
        3. ...
  - type: input
    id: model
    attributes:
      label: TV model and year
      placeholder: QE55Q950RBTXXU, 2019
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Immich TV version
      placeholder: 0.1.1 (beta 2)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Apps2Samsung catalogue
        - Apps2Samsung, custom .wgt
        - Tizen Studio
        - Other
    validations:
      required: true
  - type: input
    id: immich
    attributes:
      label: Immich server version
      placeholder: 3.3.5
